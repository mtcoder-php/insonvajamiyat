# /etc/nginx/sites-available/insonvajamiyat.conf
# Faollashtirish:
#   sudo ln -s /etc/nginx/sites-available/insonvajamiyat.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL sertifikat: sudo certbot --nginx -d insonvajamiyat.uz -d www.insonvajamiyat.uz
# Eslatma: PHP-FPM socket yo'li o'rnatilgan PHP versiyasiga mos bo'lishi kerak (php8.3-fpm.sock).

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name insonvajamiyat.uz www.insonvajamiyat.uz;

    # certbot yangilashi uchun
    location /.well-known/acme-challenge/ {
        root /var/www/insonvajamiyat/public;
    }

    location / {
        return 301 https://insonvajamiyat.uz$request_uri;
    }
}

# www → asosiy domen
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.insonvajamiyat.uz;

    ssl_certificate     /etc/letsencrypt/live/insonvajamiyat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insonvajamiyat.uz/privkey.pem;

    return 301 https://insonvajamiyat.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name insonvajamiyat.uz;

    root /var/www/insonvajamiyat/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/insonvajamiyat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insonvajamiyat.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maqola fayllari (DOCX/PDF) 10 MB gacha, zaxira tiklash va rasmlar uchun zaxira bilan
    client_max_body_size 64M;
    client_body_timeout 120s;

    server_tokens off;

    # Siqish
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript
               application/rss+xml image/svg+xml font/woff2 application/manifest+json;

    access_log /var/log/nginx/insonvajamiyat.access.log;
    error_log  /var/log/nginx/insonvajamiyat.error.log warn;

    # Vite build fayllari — nomida hash bor, 1 yil keshlanadi
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    # Ommaviy yuklangan fayllar (muqovalar, bannerlar, avatarlar)
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;

        # storage ichida PHP hech qachon bajarilmaydi
        location ~ \.php$ { return 404; }
    }

    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # AI va PDF so'rovlari navbatda ishlaydi, lekin yuklab olish uzoq davom etishi mumkin
        fastcgi_read_timeout 120s;
    }

    # Boshqa .php fayllar bajarilmaydi
    location ~ \.php$ { return 404; }

    # .env, .git va boshqa yashirin fayllar
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
