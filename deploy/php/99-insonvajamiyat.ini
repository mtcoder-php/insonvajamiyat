; /etc/php/8.3/fpm/conf.d/99-insonvajamiyat.ini  (CLI uchun ham: /etc/php/8.3/cli/conf.d/)
; Keyin: sudo systemctl restart php8.3-fpm

upload_max_filesize = 32M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
expose_php = Off

; OPcache — production tezligi uchun
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
; validate_timestamps=0 bo'lgani uchun deploy.sh oxirida php-fpm reload qilinadi

realpath_cache_size = 4096K
realpath_cache_ttl = 600
