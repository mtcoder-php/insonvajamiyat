; /etc/supervisor/conf.d/insonvajamiyat-worker.conf
; Navbat (queue) ishchilari: email xatlar, AI so'rovlar, son PDF yig'ish, ommaviy xabarlar, zaxira.
; Yoqish:
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start "insonvajamiyat-worker:*"
; Holat:  sudo supervisorctl status
; Log:    tail -f /var/www/insonvajamiyat/storage/logs/worker.log
;
; MUHIM: .env da DB_QUEUE_RETRY_AFTER (3700) eng uzun job timeout'idan (zaxira — 3600) katta bo'lsin,
; aks holda uzoq zaxira yarmida qayta ishga tushib ketadi.

[program:insonvajamiyat-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/insonvajamiyat/artisan queue:work database --sleep=3 --tries=3 --timeout=3600 --max-time=3600 --memory=512
directory=/var/www/insonvajamiyat
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3700
redirect_stderr=true
stdout_logfile=/var/www/insonvajamiyat/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
